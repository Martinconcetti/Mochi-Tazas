<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel — Mochi Tazas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF7EA;--ink:#3A1F14;--brass:#A84E24;--line:#EBD9BC;--soft:#6E5446;--sun:#F6A95E;--rose:#EE8E7C;--cream:#FBF1DC}
*{box-sizing:border-box;margin:0}
body{font:300 16px/1.5 Jost,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:var(--brass);color:var(--cream);border-bottom:3px solid var(--sun)}header button.g{color:#fff;border-color:#fff;padding:8px 18px}
.logo{display:flex;align-items:center;gap:12px;font:600 24px "Cormorant Garamond",serif}.logo img{width:40px;height:40px}.wrap section:first-child{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 24px 28px}
h2{font:500 28px "Cormorant Garamond",serif;margin-bottom:16px}
.wrap{padding:32px 5vw;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:48px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr;gap:32px}}
.login{max-width:360px;margin:12vh auto;padding:0 5vw}
label{display:block;font-size:14px;color:var(--soft);margin:14px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}.chk input{width:auto}
button{font:inherit;cursor:pointer;padding:10px 22px;border:1px solid var(--brass);background:var(--brass);color:#fff;border-radius:99px;margin-top:20px}button:hover{filter:brightness(1.1)}
button.g{background:none;color:var(--brass);margin-top:0}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;object-fit:cover;background:var(--cream);border-radius:10px}
.row small{color:var(--soft)}
.row button{padding:6px 12px;margin:0 0 0 6px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{margin:0}
.err{color:#9b2c2c;font-size:14px;margin-top:12px}
.ok{color:#3f6b4a;font-size:14px;margin-top:12px}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
</style></head>
<body>
<section class="login" id="login">
  <img src="logo.png" alt="Mochi Tazas" style="width:120px;display:block;margin:0 auto 20px"><h2>Ingresar al panel</h2>
  <label for="em">Correo</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
  <button id="go">Ingresar</button><p class="err" id="lerr"></p>
</section>

<div id="app" hidden>
<header><div class="logo"><img src="logo.png" alt=""><span>Mochi Tazas · Panel</span></div><button class="g" id="out">Cerrar sesión</button></header>
<div class="wrap">
  <section>
    <h2 id="ft">Nuevo producto</h2>
    <label for="n">Nombre</label><input id="n">
    <label for="c">Categoría</label><select id="c"></select>
    <label for="p">Precio</label><input id="p" type="number" min="0" step="1">
    <label for="i">URL de la imagen</label><input id="i" type="url" placeholder="https://…">
    <label for="d">Descripción</label><textarea id="d"></textarea>
    <div class="chk"><input id="a" type="checkbox" checked><label for="a" style="margin:0">Disponible en la tienda</label></div>
    <button id="save">Guardar producto</button> <button class="g" id="cancel" hidden>Cancelar edición</button>
    <p id="fm"></p>
  </section>
  <section>
    <div class="bar"><h2 style="margin:0">Productos</h2><button class="g" id="csv">Descargar CSV</button></div>
    <div id="list"></div>
  </section>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,addDoc,getDocs,updateDoc,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== CONFIGURACIÓN: mismos datos que en index.html ===== */
const firebaseConfig={apiKey:"TU_API_KEY",authDomain:"TU_PROYECTO.firebaseapp.com",projectId:"TU_PROYECTO",storageBucket:"TU_PROYECTO.appspot.com",messagingSenderId:"TU_SENDER_ID",appId:"TU_APP_ID"};
const CATEGORIAS=["Tazas","Pijamas","Decoración"];
/* ========================================================= */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),col=collection(db,"productos");
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[],editId=null;
$("#c").innerHTML=CATEGORIAS.map(c=>`<option>${c}</option>`).join("");

$("#go").onclick=async()=>{
  $("#lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);}
  catch{$("#lerr").textContent="Correo o contraseña incorrectos.";}
};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u)load();});

async function load(){
  const s=await getDocs(col);
  items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.categoria||"").localeCompare(b.categoria||"")||(a.nombre||"").localeCompare(b.nombre||""));
  $("#list").innerHTML=items.length?items.map(p=>`
    <div class="row"><img src="${esc(p.imagen)}" alt="">
      <div><strong>${esc(p.nombre)}</strong><br><small>${esc(p.categoria)} · $${Number(p.precio||0).toLocaleString("es-AR")}${p.disponible===false?" · Oculto":""}</small></div>
      <div><button class="g" data-e="${p.id}">Editar</button><button class="g" data-x="${p.id}">Eliminar</button></div>
    </div>`).join(""):`<p style="color:var(--soft)">Todavía no cargaste productos. Completá el formulario para agregar el primero.</p>`;
}
function reset(){editId=null;["n","p","i","d"].forEach(k=>$("#"+k).value="");$("#a").checked=true;$("#ft").textContent="Nuevo producto";$("#cancel").hidden=true;}
$("#cancel").onclick=reset;

$("#save").onclick=async()=>{
  const data={nombre:$("#n").value.trim(),categoria:$("#c").value,precio:Number($("#p").value),imagen:$("#i").value.trim(),descripcion:$("#d").value.trim(),disponible:$("#a").checked};
  const fm=$("#fm");
  if(!data.nombre||!data.imagen||!(data.precio>=0)||$("#p").value===""){fm.className="err";fm.textContent="Completá nombre, precio e imagen.";return;}
  try{
    if(editId)await updateDoc(doc(db,"productos",editId),data);
    else await addDoc(col,{...data,creado:serverTimestamp()});
    fm.className="ok";fm.textContent="Producto guardado.";reset();load();
  }catch(e){console.error(e);fm.className="err";fm.textContent="No se pudo guardar. Revisá tu sesión y las reglas de Firestore.";}
};
$("#list").onclick=async e=>{
  const ed=e.target.dataset.e,x=e.target.dataset.x;
  if(ed){const p=items.find(i=>i.id===ed);editId=ed;$("#n").value=p.nombre||"";$("#c").value=p.categoria;$("#p").value=p.precio??"";$("#i").value=p.imagen||"";$("#d").value=p.descripcion||"";$("#a").checked=p.disponible!==false;$("#ft").textContent="Editar producto";$("#cancel").hidden=false;scrollTo({top:0,behavior:"smooth"});}
  if(x&&confirm("¿Eliminar este producto? No se puede deshacer.")){await deleteDoc(doc(db,"productos",x));load();}
};
$("#csv").onclick=()=>{
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Nombre","Categoría","Precio","Disponible","Imagen","Descripción"],...items.map(p=>[p.nombre,p.categoria,p.precio,p.disponible===false?"No":"Sí",p.imagen,p.descripcion])];
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="productos.csv";a.click();
};
</script>
</body></html>
