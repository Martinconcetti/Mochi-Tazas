<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mochi Tazas — Tazas, pijamas y decoración</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDF7EA;--ink:#3A1F14;--brass:#A84E24;--line:#EBD9BC;--soft:#6E5446;--sun:#F6A95E;--rose:#EE8E7C;--cream:#FBF1DC}
*{box-sizing:border-box;margin:0}
body{font:300 16px/1.6 Jost,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--cream);border-bottom:3px solid var(--sun)}
.logo{display:flex;align-items:center;gap:12px;font:600 28px "Cormorant Garamond",serif;color:var(--brass);text-decoration:none}.logo img{width:46px;height:46px}
nav a{margin-left:24px;color:var(--ink);text-decoration:none;font-size:15px}
nav a:hover{color:var(--brass)}
.hero{position:relative;background:var(--brass);color:var(--cream);padding:9vh 5vw 12vh;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap;margin-bottom:56px}.hero::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:radial-gradient(circle at 18px 0,var(--brass) 18px,transparent 19px) 0 0/36px 18px repeat-x}.hero img{width:min(280px,60vw);border-radius:50%;box-shadow:0 18px 48px rgba(58,31,20,.35)}.hero div{max-width:640px}
.hero h1{font:500 clamp(40px,7vw,76px)/1.05 "Cormorant Garamond",serif}
.hero p{margin-top:20px;max-width:46ch;color:#F8DFC0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 5vw 28px}
.tabs button{font:inherit;background:none;border:1px solid var(--line);padding:8px 20px;border-radius:99px;cursor:pointer;color:var(--ink)}
.tabs button:hover{border-color:var(--brass)}.tabs button[aria-pressed=true]{background:var(--brass);color:#fff;border-color:var(--brass)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:32px 24px;padding:0 5vw 10vh}
.item img{width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--cream);display:block;border-radius:16px;border:1px solid var(--line)}
.item h3{font:500 22px "Cormorant Garamond",serif;margin-top:12px}
.item .d{font-size:14px;color:var(--soft)}
.item .p{color:var(--brass);font-weight:500;font-size:18px}
.item a{display:inline-block;margin-top:10px;font-size:14px;color:#fff;background:var(--brass);border-radius:99px;text-decoration:none;padding:8px 18px}.item a:hover{background:var(--ink)}
.msg{padding:0 5vw 10vh;color:var(--soft)}
footer{background:var(--ink);padding:32px 5vw;font-size:14px;color:#EBD9BC}footer a{color:var(--sun)}
a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
</style></head>
<body>
<header><a class="logo" href="#"><img src="logo.png" alt="" width="46" height="46"><span>Mochi Tazas</span></a>
<nav><a href="#catalogo">Catálogo</a><a id="wa-top" href="#">Contacto</a></nav></header>
<section class="hero"><div><h1>Pequeños placeres para cada día.</h1>
<p>Tazas, pijamas y decoración elegidos con cariño, para tus mañanas, tus noches y todo lo que pasa en el medio.</p></div><img src="logo.png" alt="Mochi Tazas"></section>
<div class="tabs" id="catalogo" role="group" aria-label="Categorías"></div>
<main class="grid" id="grid"></main>
<footer>© Mochi Tazas · Seguinos en Instagram <a href="https://instagram.com/mochi_tazas" target="_blank" rel="noopener">@mochi_tazas</a></footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== CONFIGURACIÓN: reemplazá con los datos de tu proyecto Firebase ===== */
const firebaseConfig={apiKey:"TU_API_KEY",authDomain:"TU_PROYECTO.firebaseapp.com",projectId:"TU_PROYECTO",storageBucket:"TU_PROYECTO.appspot.com",messagingSenderId:"TU_SENDER_ID",appId:"TU_APP_ID"};
const WHATSAPP="5490000000000"; /* código de país + número, sin + ni espacios */
const CATEGORIAS=["Tazas","Pijamas","Decoración"];
/* ========================================================================== */

const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wa=t=>`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
$("#wa-top").href=wa("Hola, quisiera hacer una consulta.");
let items=[],cat="Todo";

function tabs(){
  $(".tabs").innerHTML=["Todo",...CATEGORIAS].map(c=>`<button aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function render(){
  const list=items.filter(p=>cat==="Todo"||p.categoria===cat);
  $("#grid").innerHTML=list.length?list.map(p=>`
    <article class="item">
      <img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy">
      <h3>${esc(p.nombre)}</h3>
      <div class="d">${esc(p.descripcion)}</div>
      <div class="p">$${Number(p.precio||0).toLocaleString("es-AR")}</div>
      <a href="${wa(`Hola, quiero consultar stock y precio de: ${p.nombre}`)}" target="_blank" rel="noopener">Consultar por WhatsApp</a>
    </article>`).join(""):`<p class="msg">Todavía no hay productos en esta categoría.</p>`;
}
$(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;tabs();render();}});

try{
  const db=getFirestore(initializeApp(firebaseConfig));
  const snap=await getDocs(collection(db,"productos"));
  items=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.disponible!==false);
}catch(e){console.error(e);$("#grid").innerHTML=`<p class="msg">No pudimos cargar el catálogo. Intentá de nuevo en unos minutos.</p>`;}
tabs();if(items.length||$("#grid").innerHTML==="")render();
</script>
</body></html>
